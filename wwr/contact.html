<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sebastian Medina">
    <meta name="description" content="Splash White Water Rafting is a premier rafting company offering thrilling adventures on the river. Join us for an unforgettable experience!">
    <title>Contact Us - Splash White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-splash.png" alt="Sebastian Medina">
        <nav>
            <!-- Not to confuse index.html with the WDD130 index, this is an index for WWR -->
            <a href="index.html" class="nav-link">Home</a> 
            <a href="about.html" class="nav-link">About Us</a>
            <a href="trips.html" class="nav-link">Trips</a>
            <a href="contact.html" class="nav-link">Contact Us</a>
        </nav>
    </header>
   <main>
        <h1>Contact Us</h1>

        <!-- Sección de Información de la Empresa -->
        <section class="company-info">
            <h2>Company Information</h2>
            <div class="info-details">
                <p><strong>Address:</strong> 123 Rafting River Way, Adventure City, AC 84000</p>
                <p><strong>Phone:</strong> (555) 123-4567</p>
                <p><strong>Email:</strong> contact@splashrafting.com</p>
            </div>
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d144.95372981531659!3d-37.81720997975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d4ce6d05767%3A0x5045675218ce8e0!2sMelbourne%20VIC%2C%20Australia!52e0!3m2!1sen!2s!4v1614123456789!5m2!1sen!2s" 
                    width="400" 
                    height="300" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <!-- Perfiles de Empleados -->
        <section class="employee-profiles">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/rafting59_600.jpg" alt="Jane Doe - Lead Guide">
                    <figcaption>Jane Doe - Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting59_600.jpg" alt="John Smith - Operations Manager">
                    <figcaption>John Smith - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting59_600.jpg" alt="Emily Davis - Safety Officer">
                    <figcaption>Emily Davis - Safety Officer</figcaption>
                </figure>
            </div>
        </section>

        <!-- Formulario de Contacto -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">Email Address:</label>
                <input type="email" id="useremail" name="useremail" required>

                <fieldset>
                    <legend>Purpose of Message</legend>
                    <label>
                        <input type="radio" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" name="subscribe" value="yes"> Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Sebastian Medina, Venezuela - Chile</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook_icon.jpg" alt="Facebook">
            </a>
            <a href="https://www.twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter.avif" alt="Twitter">
            </a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.avif" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>
</html>
